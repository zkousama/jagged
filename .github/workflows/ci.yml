name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -v
      - name: Re-analyse committed trials
        run: |
          if [ -f data/trials/afd.jsonl ]; then
            uv run jagged analyze --trials data/trials/afd.jsonl --out /tmp/figs
          fi
